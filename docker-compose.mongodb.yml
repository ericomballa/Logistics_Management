version: '3.8'
services:
  mongodb:
    image: mongo:6
    container_name: logistics_mongodb
    restart: always
    ports:
      - "27018:27017"  # Changement du port hôte pour éviter les conflits
    volumes:
      - mongodb_data:/data/db
      - ./init-mongo.js:/docker-entrypoint-initdb.d/init-mongo.js:ro
    # Activer l'authentification après l'initialisation
    command: ["--auth"]

volumes:
  mongodb_data: